name: Ovoz video agent

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ovoz-video-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Scene "video" is now a still image (Cloudflare Workers AI) + an ffmpeg
    # Ken Burns pan/zoom, both of which take seconds, not minutes — nothing
    # like the old Flow browser-automation wait per scene. 45 minutes is a
    # generous margin for even a long story; the script still checkpoints
    # state as it goes regardless, in case ffmpeg/network hiccups add up.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "ovoz-video-agent"
          git config user.email "actions@users.noreply.github.com"

      - name: Run one polling cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ vars.TELEGRAM_ALLOWED_USER_IDS }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run run-once
        # The script itself checkpoints (commits + pushes state/state.json)
        # incrementally as it processes each update, so lastUpdateId is
        # durable even if this step is later killed by timeout-minutes or
        # crashes outright. This step is allowed to fail here — the safety
        # net below still runs.

      - name: Commit updated state (safety net)
        if: always()
        run: |
          git add state/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update bot state [skip ci]"
          fi
          git pull --rebase --autostash
          git push
